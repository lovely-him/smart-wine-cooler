<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰柜盘点</title>
<style>
  :root { --fg:#1f2328; --dim:#6a737d; --line:#d8dee4; --bg:#fff; --accent:#0969da; --warn:#bc4c00; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.5 -apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif;
         color:var(--fg); background:#f6f8fa; }
  h1 { font-size:18px; margin:0 0 12px; }
  h2 { font-size:15px; margin:20px 0 8px; }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cam { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line); }
  .cam:last-child { border-bottom:none; }
  .name { min-width:180px; font-weight:600; }
  .state { font-family:ui-monospace,monospace; font-size:12px; padding:1px 6px; border-radius:10px;
           background:#eef; color:var(--accent); }
  .state.done { background:#e6f4ea; color:#1a7f37; }
  .state.error { background:#ffebe9; color:#cf222e; }
  .state.aborted { background:#fff8c5; color:var(--warn); }
  button { font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:6px;
           background:#fff; cursor:pointer; }
  button:hover { background:#f3f4f6; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:#cf222e; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  .tier-可信 { color:#1a7f37; }
  .tier-存疑 { color:var(--warn); font-weight:600; }
  .tier-失效 { color:#cf222e; font-weight:600; }
  .muted { color:var(--dim); font-size:12px; }
  input[type=number] { width:64px; font:inherit; padding:2px 6px; }
  input[type=text] { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; }
  img.shot { max-width:360px; border:1px solid var(--line); border-radius:6px; }
  .bottle { width:106px; display:flex; flex-direction:column; gap:4px; align-items:center;
            border:1px solid var(--line); border-radius:8px; padding:6px; }
  .bottle img, .bottle .noimg { width:92px; height:92px; border-radius:4px; object-fit:cover; background:#eee; }
  .bottle .noimg { display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--dim); }
  .bottle input[type=text] { width:92px; font-size:12px; padding:2px 4px; }
  .bottle .tag { font-size:11px; }
  .layer-row { display:flex; gap:8px; align-items:flex-start; margin:8px 0; flex-wrap:wrap; }
  .layer-name { min-width:110px; font-weight:600; padding-top:8px; }
</style>
</head>
<body>
<h1>冰柜盘点</h1>

<div class="card">
  <div class="row">
    <button class="primary" onclick="startScan()">开始盘点</button>
    <button id="stopBtn" onclick="stopScan()">停止</button>
    <span class="state" id="scanState">—</span>
    <span class="muted" id="hint">—</span>
    <span class="row" id="staleBar" style="display:none;margin-left:auto">
      <span class="muted" id="staleText"></span>
      <button class="primary" onclick="applyStale()">点此更新</button>
    </span>
  </div>
  <div id="cams"></div>
</div>

<h2>当前视图（基线 + 差异）</h2>
<div class="card" id="view"></div>

<h2>确认</h2>
<div class="card">
  <div class="muted">逐个确认每瓶是什么：改成真名并提交 → 建档并收录**这一瓶**的裁剪图；
    保持「未命名」→ 记为未识别；勾「忽略」→ 不算进这次盘点。</div>
  <div id="confirmForm" style="margin-top:8px"></div>
  <div class="row" style="margin-top:10px">
    <input type="text" id="note" placeholder="备注（可选）" size="30">
    <button class="primary" onclick="confirmSubmit()">提交并成为基线</button>
    <button onclick="askAI()">让 AI 猜名</button>
    <button onclick="resetForms()">还原表单</button>
  </div>
  <div class="muted" id="aiHint"></div>
</div>

<h2>历史</h2>
<div class="card" id="history" style="max-height:320px;overflow:auto"></div>

<h2>类别</h2>
<div class="card">
  <div class="muted">改名不会断开历史（历史存的是类别 id）。合并把参考图改指向目标类别，原类别消失。
    删除会把参考图和类别一起清掉，历史里这一项会显示为「未识别」。</div>
  <div id="cats" style="margin-top:8px"></div>
</div>

<h2>维护</h2>
<div class="card">
  <div class="row">
    <button class="danger" onclick="purge()">删除所有历史记录</button>
    <span class="muted">保留基线与类别；观测图片一并删除</span>
  </div>
  <div class="row" style="margin-top:10px">
    <input type="text" id="exportUrl" placeholder="远端接收接口 URL" size="44">
    <button onclick="doExport()">推送到远端</button>
  </div>
  <div class="muted" id="exportHint">留空则用配置里的 export.url</div>
</div>

<script>
const dirty = { confirm: false, cats: false };
const stale = { confirm: false, cats: false };
const rendered = {};
let forceRender = false;
let refreshing = false;

document.addEventListener('input', ev => {
  const el = ev.target;
  if (!el || !el.closest) return;
  if (el.closest('#confirmForm')) dirty.confirm = true;
  else if (el.closest('#cats')) dirty.cats = true;
});

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function fmtTier(tier) {
  return `<span class="tier-${tier}">${tier}</span>`;
}

function paint(key, data, render) {
  const sig = JSON.stringify(data);
  if (rendered[key] === sig) return;
  render();
  rendered[key] = sig;
}

function paintForm(key, box, data, render) {
  const sig = JSON.stringify(data);
  if (rendered[key] === sig) { stale[key] = false; return; }
  if (!forceRender && (dirty[key] || box.contains(document.activeElement))) {
    stale[key] = true;
    return;
  }
  render();
  rendered[key] = sig;
  stale[key] = false;
}

function applyStale() {
  dirty.confirm = dirty.cats = false;
  delete rendered.confirm;
  delete rendered.cats;
  return refreshNow();
}

function refreshNow() {
  forceRender = true;
  return refresh();
}

function updateStaleBar() {
  const bar = document.getElementById('staleBar');
  if (!stale.confirm && !stale.cats) { bar.style.display = 'none'; return; }
  document.getElementById('staleText').textContent = stale.confirm
    ? '有新观测数据到达（确认表单未自动更新）'
    : '类别有新变化（未自动更新）';
  bar.style.display = '';
}

async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const [status, view, history] = await Promise.all([
      api('/api/status'), api('/api/view'), api('/api/history')
    ]);
    paint('cams', status.cameras, () => renderCams(status));
    paint('scan', [status.scan, status.cameras], () => renderScan(status.scan));
    paint('view', [view.baseline_names, view.reported_names, view.ready, view.observations,
      view.current_order, view.baseline_order, view.order_only, view.confirmed],
      () => renderView(view));
    paint('history', history, () => renderHistory(history));
    paintForm('confirm', document.getElementById('confirmForm'), view.draft,
      () => renderConfirm(view));
    paintForm('cats', document.getElementById('cats'), status.categories,
      () => renderCats(status.categories));
    forceRender = false;
    updateStaleBar();
    const scan = status.scan || {};
    document.getElementById('hint').textContent =
      !view.ready
        ? '还没有完成的盘点（点「开始盘点」）'
        : (!status.pending.baseline
          ? '还没有基线（确认当前结果即可建立）'
          : (status.pending.confirmed
            ? `已确认（基线 #${status.pending.baseline.id}）`
            : (status.pending.diff.length ? `待确认差异 ${status.pending.diff.length} 项` : '与基线一致')));
  } catch (err) {
    forceRender = false;
    document.getElementById('hint').textContent =
      '刷新失败: ' + err.message + '（画面仍是上一次成功的数据）';
  } finally {
    refreshing = false;
  }
}

function renderCams(status) {
  const box = document.getElementById('cams');
  box.innerHTML = status.cameras.map(cam => {
    const obs = cam.observation;
    const desc = obs ? `${fmtTier(obs.tier)} 检出 ${obs.count} 个` : '<span class="muted">尚无观测</span>';
    return `<div class="cam">
      <span class="name">${cam.name}<br><span class="muted">${cam.id}</span></span>
      <span class="state ${cam.state}">${cam.state}</span>
      <span>${desc}</span>
      <span class="muted">${cam.error || ''}</span>
    </div>`;
  }).join('');
}

function renderScan(scan) {
  const label = {idle: '空闲', running: '盘点中', done: '已完成', aborted: '已停止', failed: '未完成'}[scan.state] || scan.state;
  const parts = Object.entries(scan.finished || {}).map(([id, st]) => `${id}:${st}`);
  document.getElementById('scanState').textContent =
    `扫描${scan.id ? ' #' + scan.id : ''} ${label}` + (parts.length ? ' · ' + parts.join(' ') : '');
  document.getElementById('scanState').className = 'state ' + (scan.state === 'failed' ? 'error' : scan.state);
  document.getElementById('stopBtn').disabled = scan.state !== 'running';
}

function renderView(view) {
  const box = document.getElementById('view');
  const base = view.baseline_names || null;
  const confirmed = !!view.confirmed;
  const layers = new Set([...Object.keys(base || {}), ...Object.keys(view.reported_names || {})]);
  if (!layers.size) { box.innerHTML = '<span class="muted">还没有基线，也没有观测</span>'; return; }

  let html = `<table><tr><th>层</th><th>品类</th><th>基线</th><th>当前</th><th>差异</th></tr>`;
  for (const layer of [...layers].sort()) {
    const b = base ? (base[layer] || {}) : {};
    const r = (view.reported_names || {})[layer] || {};
    const names = new Set([...Object.keys(b), ...Object.keys(r)]);
    if (!names.size) {
      html += `<tr><td>${layer}</td><td colspan="4" class="muted">空</td></tr>`;
      continue;
    }
    for (const name of [...names].sort()) {
      const bv = b[name] || 0, rv = r[name] || 0;
      const d = rv - bv;
      const dtxt = confirmed || d === 0 ? '' : (d > 0 ? `+${d}` : `${d}`);
      html += `<tr><td>${layer}</td><td>${name}</td><td>${bv}</td><td>${rv}</td>
        <td class="${dtxt ? 'tier-存疑' : ''}">${dtxt}</td></tr>`;
    }
  }
  html += '</table>';
  if (confirmed) {
    html += `<div class="muted" style="margin-top:6px">本次扫描已确认：当前状态以基线为准，差异不计</div>`;
  }
  const curOrder = view.current_order || {};
  const layerKeys = Object.keys(curOrder);
  if (layerKeys.length) {
    const baseOrder = view.baseline_order || {};
    const onlyMap = view.order_only || {};
    html += `<div class="muted" style="margin-top:12px">位置序列（从左到右，仅用于核对，不参与判定）</div>
      <table><tr><th>层</th><th>基线</th><th>当前</th><th></th></tr>`;
    for (const layer of layerKeys.sort()) {
      const fmt = seq => (seq || []).map((n, i) => `${i + 1}.${n}`).join('　') || '-';
      const mark = onlyMap[layer] ? '<span class="tier-存疑">仅位置不同</span>' : '';
      html += `<tr><td>${layer}</td><td class="muted">${fmt(baseOrder[layer])}</td>
        <td>${fmt(curOrder[layer])}</td><td>${mark}</td></tr>`;
    }
    html += `</table>`;
  }
  if (view.baseline) {
    html += `<div class="muted" style="margin-top:8px">基线版本 #${view.baseline.id} · ${view.baseline.created_at}</div>`;
  }
  const shots = view.observations.filter(o => o.image).slice(0, 5);
  if (shots.length) {
    html += `<div class="row" style="margin-top:10px">` + shots.map(o =>
      `<div><div class="muted">${o.camera} #${o.id}</div>
       <img class="shot" src="/img/${o.id}.jpg" alt="${o.camera}"></div>`).join('') + `</div>`;
  }
  box.innerHTML = html;
}

let lastDraft = {};
let lastView = null;
let extras = {};

function renderConfirm(view) {
  const box = document.getElementById('confirmForm');
  const draft = view.draft || {};
  lastDraft = draft;
  lastView = view;
  const layers = Object.keys(draft);
  if (!layers.length) {
    box.innerHTML = '<span class="muted">先做一次盘点，拿到结果后才能确认</span>';
    return;
  }
  box.innerHTML = layers.map(layer => {
    const cards = draft[layer].map(b => `
      <div class="bottle" data-layer="${layer}" data-index="${b.index}">
        ${b.crop_url ? `<img src="${b.crop_url}" alt="">` : '<div class="noimg">无图</div>'}
        <input type="text" value="${b.name}" data-name="1">
        <div class="tag muted">${b.known ? '已识别' : '组 ' + (b.cluster || '-')}${
          b.score ? ' · ' + Number(b.score).toFixed(2) : ''}</div>
        <label class="tag muted"><input type="checkbox" data-ignore="1"> 忽略</label>
      </div>`).join('');
    const manual = (extras[layer] || []).map((name, slot) => `
      <div class="bottle" data-layer="${layer}" data-index="manual" data-slot="${slot}">
        <div class="noimg">补</div>
        <input type="text" value="${name}" data-name="1" placeholder="漏检的那瓶叫什么">
        <div class="tag muted">手工补位</div>
        <label class="tag muted"><input type="checkbox" data-ignore="1"> 忽略</label>
      </div>`).join('');
    return `<div class="layer-row"><span class="layer-name">${layer}</span>${cards || '<span class="muted">空</span>'}${manual}<button onclick="addBottle('${layer}')">+ 补一个（系统漏检）</button></div>`;
  }).join('');
}

function syncExtras() {
  document.querySelectorAll('#confirmForm .bottle[data-index="manual"]').forEach(card => {
    const layer = card.dataset.layer;
    const slot = parseInt(card.dataset.slot, 10);
    if (!extras[layer] || Number.isNaN(slot)) return;
    extras[layer][slot] = card.querySelector('input[data-name]').value;
  });
}

function addBottle(layer) {
  syncExtras();
  extras[layer] = (extras[layer] || []).concat('');
  dirty.confirm = true;
  renderConfirm(lastView || { draft: lastDraft });
  rendered.confirm = JSON.stringify(lastDraft);
}

async function askAI() {
  const hint = document.getElementById('aiHint');
  hint.textContent = 'AI 猜名中…';
  try {
    const res = await api('/api/suggest', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'
    });
    let filled = 0;
    (res.items || []).forEach(item => {
      if (!item.candidate) return;
      item.indexes.forEach(idx => {
        const card = document.querySelector(
          `#confirmForm .bottle[data-layer="${item.camera}"][data-index="${idx}"]`);
        if (!card) return;
        const input = card.querySelector('input[data-name]');
        if (input.value.startsWith('未命名')) { input.value = item.candidate; filled++; }
      });
    });
    dirty.confirm = true;
    hint.textContent = filled
      ? `AI 填了 ${filled} 瓶（${res.source}，今日调用 ${res.calls}${res.limit ? '/' + res.limit : ''}）`
      : (res.blocked ? '已达今日调用上限，请手填' : '没猜出来，请手填');
  } catch (err) {
    hint.textContent = 'AI 猜名失败: ' + err.message;
  }
}

function renderCats(categories) {
  const box = document.getElementById('cats');
  if (!categories || !categories.length) { box.innerHTML = '<span class="muted">还没有类别</span>'; return; }
  if (categories.length < 2) {
    box.innerHTML = `<div class="muted">只有一个类别，无合并项</div>` + catTable(categories, '');
    return;
  }
  box.innerHTML = catTable(categories, categories.map(c => `<option value="${c.id}">${c.name}</option>`).join(''));
}

function catTable(categories, options) {
  return `<table><tr><th>id</th><th>名字</th><th>参考图</th><th>操作</th></tr>` +
    categories.map(c => `<tr>
      <td>${c.id}</td>
      <td><input type="text" value="${c.name}" size="14" data-cid="${c.id}"></td>
      <td>${c.refs ? `${c.refs} 张参考图` : '<span class="tier-存疑">无参考图，不会命中</span>'}</td>
      <td class="row">
        <button onclick="renameCat(${c.id}, this)">改名</button>
        ${options ? `<span class="muted">并入</span>
        <select data-src="${c.id}" style="font:inherit">${options}</select>
        <button onclick="mergeCat(${c.id}, this)">合并</button>` : ''}
        <button class="danger" onclick="deleteCat(${c.id})">删除</button>
      </td></tr>`).join('') + `</table>`;
}

async function deleteCat(id) {
  if (!confirm('删除后该类别及其参考图都会消失，历史记录里这一项会显示为「未识别」。此操作不可恢复，继续？')) return;
  try {
    await api('/api/categories/delete', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id})});
    dirty.cats = false;
    delete rendered.cats;
    return refreshNow();
  } catch (err) { alert(err.message); }
}

async function renameCat(id, btn) {
  const input = btn.closest('tr').querySelector('input[data-cid]');
  const name = input.value.trim();
  if (!name) { alert('名字不能为空'); return; }
  try {
    await api('/api/categories/rename', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id, name})});
    dirty.cats = false;
    delete rendered.cats;
    return refreshNow();
  } catch (err) { alert(err.message); }
}

async function mergeCat(from, btn) {
  const to = parseInt(btn.closest('tr').querySelector('select[data-src]').value, 10);
  if (to === from) { alert('不能合并到自己'); return; }
  if (!confirm('确认把该类别并入所选类别？参考图会改指向，原类别归档')) return;
  try {
    await api('/api/categories/merge', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from, to})});
    dirty.cats = false;
    delete rendered.cats;
    return refreshNow();
  } catch (err) { alert(err.message); }
}

function renderHistory(history) {
  const box = document.getElementById('history');
  const keep = box.scrollTop;
  let html = `<div class="muted">观测</div><table>`;
  for (const obs of history.observations) {
    html += `<tr><td>#${obs.id}</td><td>${obs.camera}</td><td>${fmtTier(obs.tier)}</td>
      <td>${obs.count} 个</td><td class="muted">${obs.created_at}</td>
      <td class="muted">${(obs.reasons || []).join('；')}</td></tr>`;
  }
  html += `</table><div class="muted" style="margin-top:10px">确认记录（相对基线的净变化 / 用户纠错）</div><table>`;
  for (const conf of history.confirmations) {
    const net = conf.baseline_delta.map(x => `${x.layer}/${x.category} ${x.reported}→${x.submitted}`).join('；') || '无变化';
    const corr = conf.corrections.map(x => `${x.layer}/${x.category} 系统${x.reported}→用户${x.submitted}`).join('；') || '无纠错';
    html += `<tr><td>#${conf.id}</td><td>基线 #${conf.baseline_id}</td>
      <td class="muted">${net}</td><td class="muted">${corr}</td>
      <td class="muted">${conf.created_at}</td></tr>`;
  }
  html += `</table>`;
  box.innerHTML = html;
  box.scrollTop = keep;
}

function resetForms() {
  applyStale();
}

async function startScan() {
  try {
    await api('/api/scan/start', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: '{}'});
    setTimeout(refresh, 120);
  } catch (err) { alert(err.message); }
}

async function stopScan() {
  try {
    await api('/api/scan/abort', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: '{}'});
    setTimeout(refresh, 120);
  } catch (err) { alert(err.message); }
}

async function confirmSubmit() {
  const items = {};
  Object.keys(lastDraft).forEach(layer => { items[layer] = []; });
  document.querySelectorAll('#confirmForm .bottle').forEach(card => {
    const layer = card.dataset.layer;
    const raw = card.dataset.index;
    (items[layer] = items[layer] || []).push({
      index: raw === 'manual' ? null : parseInt(raw, 10),
      name: card.querySelector('input[data-name]').value.trim(),
      ignore: card.querySelector('input[data-ignore]').checked,
    });
  });
  try {
    const res = await api('/api/confirm', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({items, note: document.getElementById('note').value})
    });
    const added = res.ingest ? res.ingest.added : 0;
    const named = res.ingest ? res.ingest.named : 0;
    const extra = named
      ? `命名 ${named} 瓶，其中 ${added} 张裁剪图已入库`
      : '没有命名新类别';
    alert(`已提交，基线版本 #${res.baseline_id}\n${extra}`);
    dirty.confirm = false;
    extras = {};
    delete rendered.confirm;
    return refreshNow();
  } catch (err) { alert(err.message); }
}

async function purge() {
  if (!confirm('确认删除所有历史记录（观测/事件/确认），保留基线与类别？')) return;
  try {
    await api('/api/purge', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({keep_observations: 0})});
    refresh();
  } catch (err) { alert(err.message); }
}

async function doExport() {
  const url = document.getElementById('exportUrl').value.trim();
  try {
    const res = await api('/api/export', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})});
    document.getElementById('exportHint').textContent = `已推送：HTTP ${res.status}，${res.bytes} 字节`;
  } catch (err) {
    document.getElementById('exportHint').textContent = '推送失败: ' + err.message;
  }
}

refresh();
setInterval(refresh, 2000);
</script>
